<text x="40" y="464.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="62" y="465.25" font-size="21" font-weight="bold" fill="#222">Fewer hits, evenly</text>
<text x="62" y="491.25" font-size="21" font-weight="bold" fill="#222">spread</text>
<text x="36" y="516.25" font-size="17" fill="#333">Lower density removes hits; the</text>
<text x="36" y="538.25" font-size="17" fill="#333">rest stay evenly spaced.</text>
<line x1="360" y1="634.25" x2="491.25" y2="475.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="566.25" width="340" height="136" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="588.25" r="13" fill="#d98a1f"/>
