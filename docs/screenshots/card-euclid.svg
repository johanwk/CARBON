<text x="942.0" y="579.0" font-size="21" font-weight="bold" fill="#222">Density  -</text>
<text x="942.0" y="605.0" font-size="21" font-weight="bold" fill="#222">Shift+Pattern</text>
<text x="916.0" y="630.0" font-size="17" fill="#333">0-100%. Here 31%: 5 of 16 steps.</text>
