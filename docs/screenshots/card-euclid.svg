<text x="62" y="595.25" font-size="21" font-weight="bold" fill="#222">Rotation moves the</text>
<text x="62" y="621.25" font-size="21" font-weight="bold" fill="#222">rhythm</text>
<text x="36" y="646.25" font-size="17" fill="#333">The same pattern starts later.</text>
<text x="36" y="668.25" font-size="17" fill="#333">Rotation runs from 0 to the window</text>
<text x="36" y="690.25" font-size="17" fill="#333">length.</text>
