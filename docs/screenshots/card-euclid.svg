<text x="62" y="361.25" font-size="21" font-weight="bold" fill="#222">Density 100% = original</text>
<text x="36" y="386.25" font-size="17" fill="#333">At 100% the selected pattern plays</text>
<text x="36" y="408.25" font-size="17" fill="#333">exactly as before.</text>
