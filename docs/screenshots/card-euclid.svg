<text x="40" y="234.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="62" y="235.25" font-size="21" font-weight="bold" fill="#222">The active hits</text>
<text x="36" y="260.25" font-size="17" fill="#333">Red cells: steps that play.</text>
<text x="36" y="282.25" font-size="17" fill="#333">Density spreads them as evenly as</text>
