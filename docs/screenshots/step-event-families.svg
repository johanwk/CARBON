<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 800" font-family="Helvetica, Arial, sans-serif">
<rect width="1260" height="800" fill="#fff"/>
<text x="630.0" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#222">Step events: four families</text>
<text x="630.0" y="80" text-anchor="middle" font-size="18" fill="#777">Each step has six slots. Each slot holds one event, read left to right.</text>
<text x="630.0" y="112" text-anchor="middle" font-size="17" fill="#444">Ask what you want the step to do, then pick from that family.</text>
<rect x="30" y="150" width="285" height="62" rx="10" fill="#3f9d4a"/>
<text x="46" y="177" font-size="22" font-weight="bold" fill="#fff">Sound</text>
<text x="46" y="200" font-size="14.5" fill="#fff">What plays?</text>
<rect x="30" y="224" width="285" height="74" rx="8" fill="#fff" stroke="#3f9d4a" stroke-width="2.5"/>
<rect x="42" y="236" width="52" height="30" rx="5" fill="#3f9d4a"/>
<text x="68" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">N</text>
<text x="106" y="257" font-size="17" font-weight="bold" fill="#222">Note</text>
<text x="42" y="280" font-size="13.5" fill="#333">Pitch, velocity, length and delay.</text>
<text x="42" y="296" font-size="13.5" fill="#333">The only event you hear directly.</text>
<rect x="335" y="150" width="285" height="62" rx="10" fill="#2f6fc0"/>
<text x="351" y="177" font-size="22" font-weight="bold" fill="#fff">Conditions</text>
<text x="351" y="200" font-size="13" fill="#fff">Do the slots to the right run this time?</text>
<rect x="335" y="224" width="285" height="74" rx="8" fill="#fff" stroke="#2f6fc0" stroke-width="2.5"/>
<rect x="347" y="236" width="52" height="30" rx="5" fill="#2f6fc0"/>
<text x="373" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Scn</text>
<text x="411" y="257" font-size="17" font-weight="bold" fill="#222">Scene gate</text>
<text x="347" y="280" font-size="13.5" fill="#333">Only in the chosen scenes.</text>
<rect x="335" y="310" width="285" height="74" rx="8" fill="#fff" stroke="#2f6fc0" stroke-width="2.5"/>
<rect x="347" y="322" width="52" height="30" rx="5" fill="#2f6fc0"/>
<text x="373" y="343" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Prb</text>
<text x="411" y="343" font-size="17" font-weight="bold" fill="#222">Probability</text>
<text x="347" y="366" font-size="13.5" fill="#333">A random chance, 0-100%.</text>
<rect x="335" y="396" width="285" height="74" rx="8" fill="#fff" stroke="#2f6fc0" stroke-width="2.5"/>
<rect x="347" y="408" width="52" height="30" rx="5" fill="#2f6fc0"/>
<text x="373" y="429" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Euc</text>
<text x="411" y="429" font-size="17" font-weight="bold" fill="#222">Euclidean</text>
<text x="347" y="452" font-size="13.5" fill="#333">A of every B loops, evenly spread.</text>
<rect x="335" y="482" width="285" height="74" rx="8" fill="#fff" stroke="#2f6fc0" stroke-width="2.5"/>
<rect x="347" y="494" width="52" height="30" rx="5" fill="#2f6fc0"/>
<text x="373" y="515" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Pre</text>
<text x="411" y="515" font-size="17" font-weight="bold" fill="#222">Previous</text>
<text x="347" y="538" font-size="13.5" fill="#333">If a condition triggered last time.</text>
<rect x="335" y="568" width="285" height="74" rx="8" fill="#fff" stroke="#2f6fc0" stroke-width="2.5"/>
<rect x="347" y="580" width="52" height="30" rx="5" fill="#2f6fc0"/>
<text x="373" y="601" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">!Pr</text>
<text x="411" y="601" font-size="17" font-weight="bold" fill="#222">Not previous</text>
<text x="347" y="624" font-size="13.5" fill="#333">If nothing triggered last time.</text>
<rect x="640" y="150" width="285" height="62" rx="10" fill="#8a4fc0"/>
<text x="656" y="177" font-size="22" font-weight="bold" fill="#fff">Messages out</text>
<text x="656" y="200" font-size="14.5" fill="#fff">What else is sent to the synth?</text>
<rect x="640" y="224" width="285" height="74" rx="8" fill="#fff" stroke="#8a4fc0" stroke-width="2.5"/>
<rect x="652" y="236" width="52" height="30" rx="5" fill="#8a4fc0"/>
<text x="678" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">CC</text>
<text x="716" y="257" font-size="17" font-weight="bold" fill="#222">MIDI CC</text>
<text x="652" y="280" font-size="13.5" fill="#333">A controller value, e.g. filter or</text>
<text x="652" y="296" font-size="13.5" fill="#333">mod wheel.</text>
<rect x="640" y="310" width="285" height="74" rx="8" fill="#fff" stroke="#8a4fc0" stroke-width="2.5"/>
<rect x="652" y="322" width="52" height="30" rx="5" fill="#8a4fc0"/>
<text x="678" y="343" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">PC</text>
<text x="716" y="343" font-size="17" font-weight="bold" fill="#222">Program Change</text>
<text x="652" y="366" font-size="13.5" fill="#333">Switch the synth&#x27;s patch.</text>
<rect x="945" y="150" width="285" height="62" rx="10" fill="#c0504d"/>
<text x="961" y="177" font-size="22" font-weight="bold" fill="#fff">Shaping</text>
<text x="961" y="200" font-size="13" fill="#fff">How do this or other tracks change?</text>
<rect x="945" y="224" width="285" height="74" rx="8" fill="#fff" stroke="#c0504d" stroke-width="2.5"/>
<rect x="957" y="236" width="52" height="30" rx="5" fill="#c0504d"/>
<text x="983" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">CCi</text>
<text x="1021" y="257" font-size="17" font-weight="bold" fill="#222">Internal CC</text>
<text x="957" y="280" font-size="13.5" fill="#333">Changes a setting of the tracks that</text>
<text x="957" y="296" font-size="13.5" fill="#333">follow this one as Bias Track.</text>
<rect x="945" y="310" width="285" height="74" rx="8" fill="#fff" stroke="#c0504d" stroke-width="2.5"/>
<rect x="957" y="322" width="52" height="30" rx="5" fill="#c0504d"/>
<text x="983" y="343" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Hrm</text>
<text x="1021" y="343" font-size="17" font-weight="bold" fill="#222">Harmony</text>
<text x="957" y="366" font-size="13.5" fill="#333">Changes scale and root for this</text>
<text x="957" y="382" font-size="13.5" fill="#333">track and its Bias followers.</text>
<rect x="945" y="396" width="285" height="74" rx="8" fill="#fff" stroke="#c0504d" stroke-width="2.5"/>
<rect x="957" y="408" width="52" height="30" rx="5" fill="#c0504d"/>
<text x="983" y="429" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Inv</text>
<text x="1021" y="429" font-size="17" font-weight="bold" fill="#222">Inversion</text>
<text x="957" y="452" font-size="13.5" fill="#333">Re-voices chords on tracks that</text>
<text x="957" y="468" font-size="13.5" fill="#333">follow this one as Bias Track.</text>
<rect x="945" y="482" width="285" height="74" rx="8" fill="#fff" stroke="#c0504d" stroke-width="2.5"/>
<rect x="957" y="494" width="52" height="30" rx="5" fill="#c0504d"/>
<text x="983" y="515" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Gli</text>
<text x="1021" y="515" font-size="17" font-weight="bold" fill="#222">Glide</text>
<text x="957" y="538" font-size="13.5" fill="#333">Slide into the notes to its right on</text>
<text x="957" y="554" font-size="13.5" fill="#333">this step.</text>
<text x="30" y="690" font-size="17" font-weight="bold" fill="#222">Choosing a type: select one slot (Shift+Motion Start), then turn Shift+Transpose. Types come in this order:</text>
<rect x="50.0" y="708" width="82" height="34" rx="6" fill="#3f9d4a"/>
<text x="91.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">N</text>
<path d="M135.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="148.0" y="708" width="82" height="34" rx="6" fill="#8a4fc0"/>
<text x="189.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">CC</text>
<path d="M233.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="246.0" y="708" width="82" height="34" rx="6" fill="#c0504d"/>
<text x="287.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">CCi</text>
<path d="M331.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="344.0" y="708" width="82" height="34" rx="6" fill="#8a4fc0"/>
<text x="385.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">PC</text>
<path d="M429.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="442.0" y="708" width="82" height="34" rx="6" fill="#2f6fc0"/>
<text x="483.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Scn</text>
<path d="M527.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="540.0" y="708" width="82" height="34" rx="6" fill="#2f6fc0"/>
<text x="581.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Prb</text>
<path d="M625.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="638.0" y="708" width="82" height="34" rx="6" fill="#2f6fc0"/>
<text x="679.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Euc</text>
<path d="M723.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="736.0" y="708" width="82" height="34" rx="6" fill="#2f6fc0"/>
<text x="777.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Pre</text>
<path d="M821.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="834.0" y="708" width="82" height="34" rx="6" fill="#2f6fc0"/>
<text x="875.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">!Pr</text>
<path d="M919.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="932.0" y="708" width="82" height="34" rx="6" fill="#c0504d"/>
<text x="973.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Hrm</text>
<path d="M1017.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="1030.0" y="708" width="82" height="34" rx="6" fill="#c0504d"/>
<text x="1071.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Inv</text>
<path d="M1115.0,725 l10,0 m-5,-4 l5,4 l-5,4" fill="none" stroke="#888" stroke-width="2"/>
<rect x="1128.0" y="708" width="82" height="34" rx="6" fill="#c0504d"/>
<text x="1169.0" y="731" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" font-family="Menlo, monospace">Gli</text>
<text x="630.0" y="770" text-anchor="middle" font-size="14" fill="#777">The list wraps around: after Gli comes N again. Ratchet and Step delay are not events; they belong to the whole step.</text>
</svg>
