<text x="62" y="221.5" font-size="21" font-weight="bold" fill="#222">What they do</text>
<text x="36" y="246.5" font-size="17" fill="#333">Placed on a Bias source, they</text>
<text x="36" y="268.5" font-size="17" fill="#333">change harmony and chord voicing</text>
<text x="36" y="290.5" font-size="17" fill="#333">on the tracks that follow it.</text>
