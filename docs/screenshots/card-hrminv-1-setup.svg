<text x="36" y="412.0" font-size="17" fill="#333">A3: the bias. Followers are</text>
<text x="36" y="434.0" font-size="17" fill="#333">transposed by its distance from</text>
<text x="36" y="456.0" font-size="17" fill="#333">C4.</text>
