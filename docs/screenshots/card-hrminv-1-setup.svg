<text x="62" y="539.0" font-size="21" font-weight="bold" fill="#222">Transpose / Length</text>
<text x="36" y="564.0" font-size="17" fill="#333">Transpose: scale, Keep or 1-16</text>
<text x="36" y="586.0" font-size="17" fill="#333">(here 2 = Major). Length/Value:</text>
<text x="36" y="608.0" font-size="17" fill="#333">root Keep, Off or C-B.</text>
