<text x="942.0" y="215.75" font-size="21" font-weight="bold" fill="#222">Selected step  -</text>
<text x="942.0" y="241.75" font-size="21" font-weight="bold" fill="#222">Motion Start</text>
<text x="916.0" y="266.75" font-size="17" fill="#333">Turn Motion Start to move between</text>
