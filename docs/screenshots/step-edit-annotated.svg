<text x="62" y="669.0" font-size="21" font-weight="bold" fill="#222">Ratchet - Pattern dial</text>
<text x="36" y="694.0" font-size="17" fill="#333">Repeats for the whole step. Step</text>
<text x="36" y="716.0" font-size="17" fill="#333">delay is the shared delay (Speed</text>
<text x="36" y="738.0" font-size="17" fill="#333">with all slots).</text>
