<text x="942.0" y="457.0" font-size="21" font-weight="bold" fill="#222">What you are editing</text>
<text x="916.0" y="482.0" font-size="17" fill="#333">Track and step number.</text>
<line x1="900.0" y1="565.0" x2="780.0" y2="567.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="510.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="532.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="538.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">8</text>
<text x="942.0" y="539.0" font-size="21" font-weight="bold" fill="#222">Event slots</text>
<text x="916.0" y="564.0" font-size="17" fill="#333">Up to six per step. N = note;</text>
<text x="916.0" y="586.0" font-size="17" fill="#333">others are controls such as Prb</text>
<text x="916.0" y="608.0" font-size="17" fill="#333">(probability).</text>
<line x1="900.0" y1="693.0" x2="650.0" y2="612.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="636.0" width="340" height="114" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="658.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="664.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">9</text>
<text x="942.0" y="665.0" font-size="21" font-weight="bold" fill="#222">Selected slot  -</text>
<text x="942.0" y="691.0" font-size="21" font-weight="bold" fill="#222">Shift+Motion Start</text>
<text x="916.0" y="716.0" font-size="17" fill="#333">Edit one slot (highlighted column)</text>
<text x="916.0" y="738.0" font-size="17" fill="#333">or all slots at once.</text>
