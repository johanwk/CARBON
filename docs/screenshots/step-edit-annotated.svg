<text x="62" y="461.0" font-size="21" font-weight="bold" fill="#222">Gate - Gate dial</text>
<text x="36" y="486.0" font-size="17" fill="#333">Length of each note.</text>
<line x1="360" y1="569.0" x2="490.0" y2="627.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
