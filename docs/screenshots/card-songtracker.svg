<line x1="360" y1="213.0" x2="482.5" y2="231.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="158.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="180.0" r="13" fill="#d98a1f"/>
<text x="40" y="186.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="62" y="187.0" font-size="21" font-weight="bold" fill="#222">Scene, steps, page</text>
<text x="36" y="212.0" font-size="17" fill="#333">play = follows the playhead.</text>
<text x="36" y="234.0" font-size="17" fill="#333">Motion Start pages 1-4 (stops</text>
<text x="36" y="256.0" font-size="17" fill="#333">follow), then Settings.</text>
<line x1="360" y1="339.0" x2="527.5" y2="245.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="284.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="306.0" r="13" fill="#d98a1f"/>
<text x="40" y="312.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="62" y="313.0" font-size="21" font-weight="bold" fill="#222">Selected track</text>
<text x="36" y="338.0" font-size="17" fill="#333">Bright header. Tracks have numbers</text>
<text x="36" y="360.0" font-size="17" fill="#333">only; the footer shows its channel</text>
<text x="36" y="382.0" font-size="17" fill="#333">and region.</text>
<line x1="360" y1="454.0" x2="592.5" y2="278.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="410.0" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="432.0" r="13" fill="#d98a1f"/>
<text x="40" y="438.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="62" y="439.0" font-size="21" font-weight="bold" fill="#222">Held note</text>
<text x="36" y="464.0" font-size="17" fill="#333">||| : a note from an earlier step</text>
<text x="36" y="486.0" font-size="17" fill="#333">still sounds.</text>
<line x1="360" y1="569.0" x2="650.0" y2="313.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="514.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="536.0" r="13" fill="#d98a1f"/>
<text x="40" y="542.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="62" y="543.0" font-size="21" font-weight="bold" fill="#222">Playheads</text>
<text x="36" y="568.0" font-size="17" fill="#333">Grey cell per track. T4 runs 8ths,</text>
<text x="36" y="590.0" font-size="17" fill="#333">so it is at step 5 while the</text>
<text x="36" y="612.0" font-size="17" fill="#333">others are at 10.</text>
<line x1="360" y1="695.0" x2="492.5" y2="368.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="640.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="662.0" r="13" fill="#d98a1f"/>
<text x="40" y="668.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="62" y="669.0" font-size="21" font-weight="bold" fill="#222">* = Hrm change</text>
<text x="36" y="694.0" font-size="17" fill="#333">Step numbers: beat starts bright.</text>
<text x="36" y="716.0" font-size="17" fill="#333">A star marks a step holding a Hrm</text>
<text x="36" y="738.0" font-size="17" fill="#333">event.</text>
<line x1="900.0" y1="224.0" x2="667.5" y2="245.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="180.0" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="202.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="208.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
<text x="942.0" y="209.0" font-size="21" font-weight="bold" fill="#222">First note per track</text>
<text x="916.0" y="234.0" font-size="17" fill="#333">Name (GM name on DRUM tracks).</text>
<text x="916.0" y="256.0" font-size="17" fill="#333">Brightness = velocity.</text>
<line x1="900.0" y1="339.0" x2="548.75" y2="313.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="284.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="306.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="312.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">7</text>
<text x="942.0" y="313.0" font-size="21" font-weight="bold" fill="#222">Flag after the note</text>
<text x="916.0" y="338.0" font-size="17" fill="#333">+ more notes, &quot; ratchet, ?</text>
<text x="916.0" y="360.0" font-size="17" fill="#333">condition, ~ glide, h Hrm/Inv, c</text>
<text x="916.0" y="382.0" font-size="17" fill="#333">CC/PC, &#x27; own delay.</text>
<line x1="900.0" y1="465.0" x2="730.0" y2="445.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="410.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="432.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="438.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">8</text>
<text x="942.0" y="439.0" font-size="21" font-weight="bold" fill="#222">Disabled steps</text>
<text x="916.0" y="464.0" font-size="17" fill="#333">Dark grey = step plays. Black =</text>
<text x="916.0" y="486.0" font-size="17" fill="#333">outside the region or masked by</text>
<text x="916.0" y="508.0" font-size="17" fill="#333">Pattern/Euclid.</text>
<line x1="900.0" y1="580.0" x2="555.0" y2="492.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="536.0" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="558.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="564.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">9</text>
<text x="942.0" y="565.0" font-size="21" font-weight="bold" fill="#222">Footer: region</text>
<text x="916.0" y="590.0" font-size="17" fill="#333">Reference track (first selected).</text>
<text x="916.0" y="612.0" font-size="17" fill="#333">Harmony stays in the status lines.</text>
<line x1="900.0" y1="695.0" x2="680.0" y2="506.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="640.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="662.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="668.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">10</text>
<text x="942.0" y="669.0" font-size="21" font-weight="bold" fill="#222">Outputs A and B</text>
<text x="916.0" y="694.0" font-size="17" fill="#333">As heard: DIN1/DIN2/USBHOST/USBDEV</text>
<text x="916.0" y="716.0" font-size="17" fill="#333">+ channel, or CV jacks for the</text>
<text x="916.0" y="738.0" font-size="17" fill="#333">pairing. CV ABCD = DRUM drum map.</text>
</svg>
