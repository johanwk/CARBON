<circle cx="40" cy="209.25" r="13" fill="#d98a1f"/>
<text x="40" y="215.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="62" y="216.25" font-size="21" font-weight="bold" fill="#222">EDIT: lanes view</text>
<text x="36" y="241.25" font-size="17" fill="#333">Long press Edit cycles compact,</text>
<text x="36" y="263.25" font-size="17" fill="#333">expanded, lanes.</text>
<line x1="360" y1="346.25" x2="492.5" y2="291.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="291.25" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="313.25" r="13" fill="#d98a1f"/>
<text x="40" y="319.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="62" y="320.25" font-size="21" font-weight="bold" fill="#222">Empty rows</text>
<text x="36" y="345.25" font-size="17" fill="#333">Transpose on an empty row chooses</text>
<text x="36" y="367.25" font-size="17" fill="#333">a drum. On a used row it moves the</text>
<text x="36" y="389.25" font-size="17" fill="#333">whole lane.</text>
<line x1="360" y1="474.25" x2="582.5" y2="448.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="417.25" width="340" height="114" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="439.25" r="13" fill="#d98a1f"/>
<text x="40" y="445.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="62" y="446.25" font-size="21" font-weight="bold" fill="#222">Cursor  -</text>
<text x="62" y="472.25" font-size="21" font-weight="bold" fill="#222">Start / Shift+Start</text>
<text x="36" y="497.25" font-size="17" fill="#333">Start moves the step, Shift+Start</text>
<text x="36" y="519.25" font-size="17" fill="#333">the row.</text>
<line x1="900.0" y1="360.0" x2="755.0" y2="360.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="316.0" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="338.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="344.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
<text x="942.0" y="345.0" font-size="21" font-weight="bold" fill="#222">Fill and rotate a lane</text>
<text x="916.0" y="370.0" font-size="17" fill="#333">Shift+Pattern: Euclidean fill.</text>
<text x="916.0" y="392.0" font-size="17" fill="#333">Shift+Transpose: rotate the lane.</text>
<line x1="900.0" y1="580.0" x2="780.0" y2="597.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="536.0" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="558.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="564.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="942.0" y="565.0" font-size="21" font-weight="bold" fill="#222">Cursor hit</text>
<text x="916.0" y="590.0" font-size="17" fill="#333">Drum, velocity, gate and delay of</text>
<text x="916.0" y="612.0" font-size="17" fill="#333">the hit under the cursor.</text>
<line x1="900.0" y1="695.0" x2="780.0" y2="641.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="640.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="662.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="668.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="942.0" y="669.0" font-size="21" font-weight="bold" fill="#222">Value adds and removes</text>
<text x="916.0" y="694.0" font-size="17" fill="#333">Value adds a hit or sets velocity;</text>
<text x="916.0" y="716.0" font-size="17" fill="#333">Shift+Value deletes. Gate and</text>
<text x="916.0" y="738.0" font-size="17" fill="#333">Speed set gate and delay.</text>
</svg>
