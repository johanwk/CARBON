<rect width="1260" height="770" fill="#fff"/>
<text x="630.0" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#222">DRUM lanes in Step Edit</text>
<text x="630.0" y="80" text-anchor="middle" font-size="18" fill="#777">Long press Edit twice on a DRUM track. Rendered from example data.</text>
