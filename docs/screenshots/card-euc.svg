<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 770" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#d98a1f"/></marker></defs>
<rect width="1260" height="770" fill="#fff"/>
<text x="630.0" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#222">Event card: Euc (Euclidean loops)</text>
<text x="630.0" y="80" text-anchor="middle" font-size="18" fill="#777">Condition. Step Edit, expanded, slot 1 selected. Rendered from example data.</text>
<rect x="422" y="102" width="416.0" height="616.0" rx="10" fill="#333"/>
<image x="430" y="110" width="400.0" height="600.0" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<g transform="translate(430 110) scale(1.25)">
<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#3a3a3a"/><line x1="0" y1="0" x2="0" y2="4" stroke="#777" stroke-width="1.5"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ddd"/></marker></defs>
<path fill-rule="evenodd" fill="#101418" fill-opacity="0.97" d="M40,90 h238 v238 h-238 z M245,92 v31 h31 v-31 z"/>
<rect x="245" y="92" width="31" height="31" fill="none" stroke="#fff" stroke-width="1"/>
<text x="49" y="104" font-size="10" font-weight="bold" fill="#fff">Euc 3:8: three loops out of every</text>
<text x="49" y="116" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">eight, spread evenly</text>
<text x="49" y="140" font-size="8.5" fill="#ddd" text-anchor="start">Step 8 holds  [Euc 3:8] [N G4].</text>
<text x="49" y="151" font-size="8.5" fill="#ddd" text-anchor="start">Euc counts LOOPS of the pattern,</text>
<text x="49" y="162" font-size="8.5" fill="#ddd" text-anchor="start">not steps: one cell = one loop.</text>
<text x="49" y="175" font-size="9" fill="#fff" font-weight="bold" text-anchor="start">Rotation 0:</text><rect x="49" y="180" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="60.0" y="194.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">G4</text><text x="60.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">1</text><rect x="74" y="180" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="85.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">2</text><rect x="99" y="180" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="110.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">3</text><rect x="124" y="180" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="135.0" y="194.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">G4</text><text x="135.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">4</text><rect x="149" y="180" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="160.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">5</text><rect x="174" y="180" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="185.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">6</text><rect x="199" y="180" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="210.0" y="194.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">G4</text><text x="210.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">7</text><rect x="224" y="180" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="235.0" y="211" font-size="7" fill="#aaa" text-anchor="middle">8</text>
<text x="49" y="223" font-size="9" fill="#fff" font-weight="bold" text-anchor="start">Rotation 1 (Length/Value dial):</text><rect x="49" y="228" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="60.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">1</text><rect x="74" y="228" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="85.0" y="242.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">G4</text><text x="85.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">2</text><rect x="99" y="228" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="110.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">3</text><rect x="124" y="228" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="135.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">4</text><rect x="149" y="228" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="160.0" y="242.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">G4</text><text x="160.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">5</text><rect x="174" y="228" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="185.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">6</text><rect x="199" y="228" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="210.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">7</text><rect x="224" y="228" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="235.0" y="242.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">G4</text><text x="235.0" y="259" font-size="7" fill="#aaa" text-anchor="middle">8</text>
<text x="49" y="274" font-size="8.5" fill="#ddd" text-anchor="start">The same rhythm repeats every 8 loops.</text>
<text x="49" y="285" font-size="8.5" fill="#ddd" text-anchor="start">Rotation shifts which loops trigger.</text>
<text x="49" y="296" font-size="8.5" fill="#ddd" text-anchor="start">Reset starts counting from loop 1.</text>
<text x="49" y="320" font-size="7.5" fill="#aaa" text-anchor="start">Explanation drawn over the grid; not shown on CARBON.</text>
</g>
<rect x="540.0" y="561.25" width="30.0" height="27.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="540.0" y="591.25" width="30.0" height="12.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="738.75" y="227.5" width="33.75" height="33.75" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="580.0" y="561.25" width="30.0" height="27.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<line x1="360" y1="247.5" x2="480.0" y2="247.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="192.5" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="214.5" r="13" fill="#d98a1f"/>
<text x="40" y="220.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="62" y="221.5" font-size="21" font-weight="bold" fill="#222">What it does</text>
<text x="36" y="246.5" font-size="17" fill="#333">Slots to its right run on A of</text>
<text x="36" y="268.5" font-size="17" fill="#333">every B loops of the track, spread</text>
<text x="36" y="290.5" font-size="17" fill="#333">as evenly as possible.</text>
<line x1="360" y1="576.0" x2="540.0" y2="582.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="532.0" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="554.0" r="13" fill="#d98a1f"/>
<text x="40" y="560.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="62" y="561.0" font-size="21" font-weight="bold" fill="#222">A:B - Transpose dial</text>
<text x="36" y="586.0" font-size="17" fill="#333">1:2 up to 7:8 (28 choices). Here</text>
<text x="36" y="608.0" font-size="17" fill="#333">3:8.</text>
<line x1="360" y1="693.0" x2="540.0" y2="597.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="636.0" width="340" height="114" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="658.0" r="13" fill="#d98a1f"/>
<text x="40" y="664.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="62" y="665.0" font-size="21" font-weight="bold" fill="#222">Rotation  -</text>
<text x="62" y="691.0" font-size="21" font-weight="bold" fill="#222">Length/Value</text>
<text x="36" y="716.0" font-size="17" fill="#333">0 to B-1: shifts which loops</text>
<text x="36" y="738.0" font-size="17" fill="#333">trigger.</text>
<line x1="900.0" y1="245.0" x2="775.0" y2="245.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="188.0" width="340" height="114" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="210.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="216.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="942.0" y="217.0" font-size="21" font-weight="bold" fill="#222">Selected step  -</text>
<text x="942.0" y="243.0" font-size="21" font-weight="bold" fill="#222">Motion Start</text>
<text x="916.0" y="268.0" font-size="17" fill="#333">Step 8. The real grid cell stays</text>
<text x="916.0" y="290.0" font-size="17" fill="#333">visible.</text>
<line x1="900.0" y1="373.0" x2="770.0" y2="348.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="318.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="340.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="346.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="942.0" y="347.0" font-size="21" font-weight="bold" fill="#222">Loops, not steps</text>
<text x="916.0" y="372.0" font-size="17" fill="#333">One cell per pass through the</text>
<text x="916.0" y="394.0" font-size="17" fill="#333">pattern. Computed with CARBON&#x27;s</text>
<text x="916.0" y="416.0" font-size="17" fill="#333">own condition code.</text>
<line x1="900.0" y1="582.5" x2="780.0" y2="582.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="538.5" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="560.5" r="13" fill="#d98a1f"/>
<text x="920.0" y="566.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
<text x="942.0" y="567.5" font-size="21" font-weight="bold" fill="#222">The note it controls</text>
<text x="916.0" y="592.5" font-size="17" fill="#333">G4 in slot 2. Good for fills and</text>
<text x="916.0" y="614.5" font-size="17" fill="#333">variations every few bars.</text>
</svg>
