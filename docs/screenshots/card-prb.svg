<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 770" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#d98a1f"/></marker></defs>
<rect width="1260" height="770" fill="#fff"/>
<text x="630.0" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#222">Event card: Prb (probability)</text>
<text x="630.0" y="80" text-anchor="middle" font-size="18" fill="#777">Condition. Step Edit, expanded, slot 1 selected. Rendered from example data.</text>
<rect x="422" y="102" width="416.0" height="616.0" rx="10" fill="#333"/>
<image x="430" y="110" width="400.0" height="600.0" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<g transform="translate(430 110) scale(1.25)">
<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#3a3a3a"/><line x1="0" y1="0" x2="0" y2="4" stroke="#777" stroke-width="1.5"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ddd"/></marker></defs>
<path fill-rule="evenodd" fill="#101418" fill-opacity="0.97" d="M40,90 h238 v238 h-238 z M100,92 v31 h31 v-31 z"/>
<rect x="100" y="92" width="31" height="31" fill="none" stroke="#fff" stroke-width="1"/>
<text x="49" y="104" font-size="10" font-weight="bold" fill="#fff"></text>
<text x="49" y="140" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">Prb 50%: a coin toss each time</text>
<text x="49" y="152" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">the step is played</text>
<text x="49" y="170" font-size="8.5" fill="#ddd" text-anchor="start">Step 3 holds  [Prb 50%] [N C5]. Each visit</text>
<text x="49" y="181" font-size="8.5" fill="#ddd" text-anchor="start">draws again; the note plays only when</text>
<text x="49" y="192" font-size="8.5" fill="#ddd" text-anchor="start">Prb triggers.</text>
<text x="49" y="205" font-size="9" fill="#fff" font-weight="bold" text-anchor="start">One example run, 8 loops:</text><rect x="49" y="210" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="60.0" y="224.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">C5</text><text x="60.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">1</text><rect x="74" y="210" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="85.0" y="224.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">C5</text><text x="85.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">2</text><rect x="99" y="210" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="110.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">3</text><rect x="124" y="210" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="135.0" y="224.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">C5</text><text x="135.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">4</text><rect x="149" y="210" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="160.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">5</text><rect x="174" y="210" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="185.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">6</text><rect x="199" y="210" width="22" height="22" rx="3" fill="#3f9d4a"/><text x="210.0" y="224.0" font-size="7.5" fill="#fff" font-weight="bold" text-anchor="middle">C5</text><text x="210.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">7</text><rect x="224" y="210" width="22" height="22" rx="3" fill="url(#hatch)" stroke="#999" stroke-width="0.6"/><text x="235.0" y="241" font-size="7" fill="#aaa" text-anchor="middle">8</text>
<text x="49" y="253" font-size="8.5" fill="#ddd" text-anchor="start">Visit number. Another run gives a</text>
<text x="49" y="264" font-size="8.5" fill="#ddd" text-anchor="start">different pattern; on average half.</text>
<text x="49" y="282" font-size="8.5" fill="#ddd" text-anchor="start">0% never triggers; 100% always does.</text>
<text x="49" y="293" font-size="8.5" fill="#ddd" text-anchor="start">Each track has its own random stream;</text>
<text x="49" y="304" font-size="8.5" fill="#ddd" text-anchor="start">Reset does not restart it.</text>
<text x="49" y="320" font-size="7.5" fill="#aaa" text-anchor="start">Explanation drawn over the grid; not shown on CARBON.</text>
</g>
<rect x="540.0" y="561.25" width="30.0" height="27.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="580.0" y="576.25" width="30.0" height="27.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="557.5" y="227.5" width="33.75" height="33.75" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="540.0" y="561.25" width="40.0" height="12.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="540.0" y="591.25" width="30.0" height="42.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<line x1="360" y1="247.5" x2="480.0" y2="247.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="192.5" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="214.5" r="13" fill="#d98a1f"/>
<text x="40" y="220.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="62" y="221.5" font-size="21" font-weight="bold" fill="#222">What it does</text>
<text x="36" y="246.5" font-size="17" fill="#333">Slots to its right run only when a</text>
<text x="36" y="268.5" font-size="17" fill="#333">random draw triggers, with the</text>
<text x="36" y="290.5" font-size="17" fill="#333">chosen chance.</text>
<line x1="360" y1="567.0" x2="540.0" y2="582.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="510.0" width="340" height="114" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="532.0" r="13" fill="#d98a1f"/>
<text x="40" y="538.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="62" y="539.0" font-size="21" font-weight="bold" fill="#222">Chance  -</text>
<text x="62" y="565.0" font-size="21" font-weight="bold" fill="#222">Transpose dial</text>
<text x="36" y="590.0" font-size="17" fill="#333">0-100%. New Prb events start at</text>
<text x="36" y="612.0" font-size="17" fill="#333">50%.</text>
<line x1="360" y1="695.0" x2="580.0" y2="597.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="640.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="662.0" r="13" fill="#d98a1f"/>
<text x="40" y="668.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="62" y="669.0" font-size="21" font-weight="bold" fill="#222">The note it controls</text>
<text x="36" y="694.0" font-size="17" fill="#333">Here a single note in slot 2. Put</text>
<text x="36" y="716.0" font-size="17" fill="#333">anything you want gated to the</text>
<text x="36" y="738.0" font-size="17" fill="#333">right of Prb.</text>
<line x1="900.0" y1="245.0" x2="593.75" y2="245.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="188.0" width="340" height="114" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="210.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="216.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="942.0" y="217.0" font-size="21" font-weight="bold" fill="#222">Selected step  -</text>
<text x="942.0" y="243.0" font-size="21" font-weight="bold" fill="#222">Motion Start</text>
<text x="916.0" y="268.0" font-size="17" fill="#333">Step 3. The real grid cell stays</text>
<text x="916.0" y="290.0" font-size="17" fill="#333">visible.</text>
<line x1="900.0" y1="386.25" x2="770.0" y2="386.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="331.25" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="353.25" r="13" fill="#d98a1f"/>
<text x="920.0" y="359.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="942.0" y="360.25" font-size="21" font-weight="bold" fill="#222">Example run</text>
<text x="916.0" y="385.25" font-size="17" fill="#333">Computed with CARBON&#x27;s own</text>
<text x="916.0" y="407.25" font-size="17" fill="#333">condition code. Green = note</text>
<text x="916.0" y="429.25" font-size="17" fill="#333">plays.</text>
<line x1="900.0" y1="567.5" x2="780.0" y2="567.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="512.5" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="534.5" r="13" fill="#d98a1f"/>
<text x="920.0" y="540.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
<text x="942.0" y="541.5" font-size="21" font-weight="bold" fill="#222">Create a Prb</text>
<text x="916.0" y="566.5" font-size="17" fill="#333">Select a slot (Shift+Motion</text>
<text x="916.0" y="588.5" font-size="17" fill="#333">Start), then Shift+Transpose until</text>
<text x="916.0" y="610.5" font-size="17" fill="#333">it shows Prb.</text>
<line x1="900.0" y1="682.5" x2="780.0" y2="627.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="638.5" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="660.5" r="13" fill="#d98a1f"/>
<text x="920.0" y="666.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">7</text>
<text x="942.0" y="667.5" font-size="21" font-weight="bold" fill="#222">Unused rows</text>
<text x="916.0" y="692.5" font-size="17" fill="#333">Vel, Gate and Dly show --- for</text>
<text x="916.0" y="714.5" font-size="17" fill="#333">conditions.</text>
</svg>
