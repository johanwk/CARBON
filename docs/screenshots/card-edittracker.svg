<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 770" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#d98a1f"/></marker></defs>
<rect width="1260" height="770" fill="#fff"/>
<text x="630.0" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#222">Tracker in Step Edit</text>
<text x="630.0" y="80" text-anchor="middle" font-size="18" fill="#777">Long press Edit twice on a VOICE track. Rendered from example data.</text>
<rect x="422" y="102" width="416.0" height="616.0" rx="10" fill="#333"/>
<image x="430" y="110" width="400.0" height="600.0" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="482.5" y="225.0" width="187.5" height="12.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="512.5" y="238.75" width="240.0" height="12.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="512.5" y="280.0" width="40.0" height="12.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="592.5" y="307.5" width="40.0" height="12.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="490.0" y="591.25" width="280.0" height="57.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<line x1="360" y1="231.25" x2="482.5" y2="231.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="176.25" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="198.25" r="13" fill="#d98a1f"/>
<text x="40" y="204.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="62" y="205.25" font-size="21" font-weight="bold" fill="#222">EDIT: tracker view</text>
<text x="36" y="230.25" font-size="17" fill="#333">Long press Edit cycles compact,</text>
<text x="36" y="252.25" font-size="17" fill="#333">expanded, tracker (lanes on DRUM</text>
<text x="36" y="274.25" font-size="17" fill="#333">tracks).</text>
<line x1="360" y1="357.25" x2="527.5" y2="245.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="302.25" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="324.25" r="13" fill="#d98a1f"/>
<text x="40" y="330.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="62" y="331.25" font-size="21" font-weight="bold" fill="#222">Event slots s1-s6</text>
<text x="36" y="356.25" font-size="17" fill="#333">One column per slot. Non-notes</text>
<text x="36" y="378.25" font-size="17" fill="#333">show short names: %50 Prb, Euc,</text>
<text x="36" y="400.25" font-size="17" fill="#333">c74 CC, Hrm, Gli.</text>
<line x1="360" y1="483.25" x2="527.5" y2="286.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="428.25" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="450.25" r="13" fill="#d98a1f"/>
<text x="40" y="456.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="62" y="457.25" font-size="21" font-weight="bold" fill="#222">Condition slot</text>
<text x="36" y="482.25" font-size="17" fill="#333">Prb 50% in s1; the ? on the note</text>
<text x="36" y="504.25" font-size="17" fill="#333">next to it marks it as</text>
<text x="36" y="526.25" font-size="17" fill="#333">conditional.</text>
<line x1="360" y1="622.25" x2="605.0" y2="313.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="554.25" width="340" height="136" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="576.25" r="13" fill="#d98a1f"/>
<text x="40" y="582.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="62" y="583.25" font-size="21" font-weight="bold" fill="#222">Cursor  -</text>
<text x="62" y="609.25" font-size="21" font-weight="bold" fill="#222">Start / Shift+Start</text>
<text x="36" y="634.25" font-size="17" fill="#333">Start moves the step (page</text>
<text x="36" y="656.25" font-size="17" fill="#333">follows), Shift+Start the slot.</text>
<text x="36" y="678.25" font-size="17" fill="#333">All slots: whole row.</text>
<line x1="900.0" y1="238.75" x2="717.5" y2="238.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="183.75" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="205.75" r="13" fill="#d98a1f"/>
<text x="920.0" y="211.75" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">7</text>
<text x="942.0" y="212.75" font-size="21" font-weight="bold" fill="#222">Track buttons</text>
<text x="916.0" y="237.75" font-size="17" fill="#333">Switch track and stay in Step Edit</text>
<text x="916.0" y="259.75" font-size="17" fill="#333">and in this view; DRUM tracks show</text>
<text x="916.0" y="281.75" font-size="17" fill="#333">lanes.</text>
<line x1="900.0" y1="388.75" x2="755.0" y2="385.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="309.75" width="340" height="158" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="331.75" r="13" fill="#d98a1f"/>
<text x="920.0" y="337.75" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
<text x="942.0" y="338.75" font-size="21" font-weight="bold" fill="#222">Edit with the usual</text>
<text x="942.0" y="364.75" font-size="21" font-weight="bold" fill="#222">dials</text>
<text x="916.0" y="389.75" font-size="17" fill="#333">Transpose note, Length velocity,</text>
<text x="916.0" y="411.75" font-size="17" fill="#333">Gate gate, Speed delay, Pattern</text>
<text x="916.0" y="433.75" font-size="17" fill="#333">ratchet. On an empty slot</text>
<text x="916.0" y="455.75" font-size="17" fill="#333">Transpose or Length adds a note.</text>
<line x1="900.0" y1="598.75" x2="780.0" y2="598.75" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="554.75" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="576.75" r="13" fill="#d98a1f"/>
<text x="920.0" y="582.75" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="942.0" y="583.75" font-size="21" font-weight="bold" fill="#222">Status lines</text>
<text x="916.0" y="608.75" font-size="17" fill="#333">The usual Step Edit details for</text>
<text x="916.0" y="630.75" font-size="17" fill="#333">the cursor step and slot.</text>
</svg>
