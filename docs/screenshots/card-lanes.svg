<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 770" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#d98a1f"/></marker></defs>
<rect width="1260" height="770" fill="#fff"/>
<text x="630.0" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#222">DRUM lanes (read-only)</text>
<text x="630.0" y="80" text-anchor="middle" font-size="18" fill="#777">Long press a DRUM track button. Rendered from example data.</text>
<rect x="422" y="102" width="416.0" height="616.0" rx="10" fill="#333"/>
<image x="430" y="110" width="400.0" height="600.0" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="482.5" y="225.0" width="150.0" height="12.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="482.5" y="370.0" width="37.5" height="125.0" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="612.5" y="415.0" width="15.0" height="22.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="702.5" y="437.5" width="15.0" height="22.5" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="522.5" y="240.0" width="240.0" height="15.0" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<rect x="702.5" y="257.5" width="60.0" height="225.0" fill="none" stroke="#d98a1f" stroke-width="2.5" rx="3"/>
<line x1="360" y1="231.25" x2="482.5" y2="231.25" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="176.25" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="198.25" r="13" fill="#d98a1f"/>
<text x="40" y="204.25" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="62" y="205.25" font-size="21" font-weight="bold" fill="#222">Track, steps and page</text>
<text x="36" y="230.25" font-size="17" fill="#333">16 steps per page. Motion Start</text>
<text x="36" y="252.25" font-size="17" fill="#333">pages 1-4, then the track&#x27;s</text>
<text x="36" y="274.25" font-size="17" fill="#333">Settings page.</text>
<line x1="360" y1="400.0" x2="482.5" y2="400.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="345.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="367.0" r="13" fill="#d98a1f"/>
<text x="40" y="373.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="62" y="374.0" font-size="21" font-weight="bold" fill="#222">One row per drum</text>
<text x="36" y="399.0" font-size="17" fill="#333">Up to 10 drums by hit count, low</text>
<text x="36" y="421.0" font-size="17" fill="#333">pitches at the bottom; the kick is</text>
<text x="36" y="443.0" font-size="17" fill="#333">always kept.</text>
<line x1="360" y1="526.0" x2="618.75" y2="425.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="471.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="493.0" r="13" fill="#d98a1f"/>
<text x="40" y="499.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="62" y="500.0" font-size="21" font-weight="bold" fill="#222">Ghost hit</text>
<text x="36" y="525.0" font-size="17" fill="#333">Below velocity 40: small square.</text>
<text x="36" y="547.0" font-size="17" fill="#333">Otherwise brightness shows</text>
<text x="36" y="569.0" font-size="17" fill="#333">velocity.</text>
<line x1="360" y1="641.0" x2="710.0" y2="455.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="20" y="597.0" width="340" height="88" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="40" cy="619.0" r="13" fill="#d98a1f"/>
<text x="40" y="625.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="62" y="626.0" font-size="21" font-weight="bold" fill="#222">Own delay</text>
<text x="36" y="651.0" font-size="17" fill="#333">A dot in the corner: the note has</text>
<text x="36" y="673.0" font-size="17" fill="#333">its own delay.</text>
<line x1="900.0" y1="245.0" x2="555.0" y2="245.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="212.0" width="340" height="66" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="234.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="240.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="942.0" y="241.0" font-size="21" font-weight="bold" fill="#222">Step numbers</text>
<text x="916.0" y="266.0" font-size="17" fill="#333">First step of each beat.</text>
<line x1="900.0" y1="360.0" x2="730.0" y2="360.0" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="305.0" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="327.0" r="13" fill="#d98a1f"/>
<text x="920.0" y="333.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
<text x="942.0" y="334.0" font-size="21" font-weight="bold" fill="#222">Outside the region</text>
<text x="916.0" y="359.0" font-size="17" fill="#333">Steps outside Motion Start/Length</text>
<text x="916.0" y="381.0" font-size="17" fill="#333">are darker. Black = masked by</text>
<text x="916.0" y="403.0" font-size="17" fill="#333">Pattern or Euclid.</text>
<line x1="900.0" y1="522.5" x2="755.0" y2="522.5" stroke="#d98a1f" stroke-width="2" marker-end="url(#dot)"/>
<rect x="900.0" y="467.5" width="340" height="110" rx="8" fill="#fff8ec" stroke="#d98a1f" stroke-width="2"/>
<circle cx="920.0" cy="489.5" r="13" fill="#d98a1f"/>
<text x="920.0" y="495.5" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">7</text>
<text x="942.0" y="496.5" font-size="21" font-weight="bold" fill="#222">Stays open</text>
<text x="916.0" y="521.5" font-size="17" fill="#333">Track buttons switch track; Record</text>
<text x="916.0" y="543.5" font-size="17" fill="#333">and Run/Stop keep the view, to</text>
<text x="916.0" y="565.5" font-size="17" fill="#333">watch a take land.</text>
</svg>
